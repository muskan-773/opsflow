version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflowdev
      POSTGRES_DB: opsflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://opsflow:opsflowdev@postgres:5432/opsflow
      TEST_DATABASE_URL: postgresql+psycopg://opsflow:opsflowdev@postgres:5432/opsflow_test
      JWT_SECRET: opsflow-docker-secret-change-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      FRONTEND_ORIGIN: http://localhost:80
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://opsflow:opsflowdev@postgres:5432/opsflow
      JWT_SECRET: opsflow-docker-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: python worker.py --interval 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
